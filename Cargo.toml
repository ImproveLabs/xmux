[workspace]
# Runnable apps live under apps/; shared Rust libraries stay under packages/.
members = [
  "apps/xmux-cli",
  "apps/xmux-macos-daemon",
  "packages/dev/improve/xmux/bridge",
  "packages/dev/improve/xmux/schema/proto/rust",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/ImproveLabs/xmux"

[workspace.dependencies]
xmux-proto = { path = "packages/dev/improve/xmux/schema/proto/rust" }
xmux-bridge = { path = "packages/dev/improve/xmux/bridge" }
prost = "0.14"
prost-build = "0.14"
protox = "0.10"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode"] }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
insta = { version = "1", features = ["yaml"] }
# Bridge transport: TLS with a self-signed certificate pinned by headsets, Bonjour advertisement.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
sha2 = "0.11"
getrandom = "0.3"
mdns-sd = "0.21"
hostname = "0.4"
proptest = "1"
# cmux Rust SDK: in-repo crate at cmux-tui/bindings/rust (crates.io only has a placeholder).
# Pin by rev; bump with `cargo update -p cmux-sdk --precise <sha>` and a CHANGELOG line.
cmux = { package = "cmux-sdk", git = "https://github.com/manaflow-ai/cmux", rev = "adc65e8aa59f2347b68cb8014c0980d634f19bc7" }

[workspace.lints.clippy]
all = "warn"
