name: release
'on':
  push:
    tags:
      - v*
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Create the draft preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --prerelease --title "XMUX $GITHUB_REF_NAME" --notes-file packages/dev/improve/xmux/configs/packaging/release-notes.md
          fi
  bridge:
    runs-on: macos-latest
    needs:
      - prepare
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up toolchain (proto)
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          run-install: false
      - name: Install dependencies
        run: vp install
      - name: Install Rust toolchain components
        run: rustup component add cargo rustc rust-std rustfmt clippy
      - name: Check the tag matches the Cargo version
        run: |-
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "xmux-bridged") | .version')"
          test "$cargo_version" = "${GITHUB_REF_NAME#v}" || { echo "tag $GITHUB_REF_NAME, Cargo $cargo_version"; exit 1; }
      - name: Build a universal macOS binary
        run: |-
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked -p xmux-bridged --target aarch64-apple-darwin
          cargo build --release --locked -p xmux-bridged --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/xmux-bridge target/aarch64-apple-darwin/release/xmux-bridge target/x86_64-apple-darwin/release/xmux-bridge
          tar -C dist -czf dist/xmux-bridge-macos-universal.tar.gz xmux-bridge
          rm dist/xmux-bridge
          (cd dist && shasum -a 256 xmux-bridge-macos-universal.tar.gz > xmux-bridge-macos-universal.tar.gz.sha256)
      - name: Render the Homebrew formula
        run: |-
          sha="$(cut -d " " -f 1 dist/xmux-bridge-macos-universal.tar.gz.sha256)"
          sed -e "s/@VERSION@/${GITHUB_REF_NAME#v}/" -e "s/@SHA256@/$sha/" packages/dev/improve/xmux/configs/packaging/homebrew/xmux-bridge.rb.in > dist/xmux-bridge.rb
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          prerelease: true
  android:
    runs-on: ubuntu-latest
    needs:
      - prepare
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up toolchain (proto)
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          run-install: false
      - name: Install dependencies
        run: vp install
      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build the store APK
        env:
          XMUX_KEYSTORE_BASE64: ${{ secrets.XMUX_KEYSTORE_BASE64 }}
          XMUX_KEYSTORE_PASSWORD: ${{ secrets.XMUX_KEYSTORE_PASSWORD }}
          XMUX_KEY_ALIAS: ${{ secrets.XMUX_KEY_ALIAS }}
          XMUX_KEY_PASSWORD: ${{ secrets.XMUX_KEY_PASSWORD }}
        run: |-
          # Without the upload keystore secret the APK is signed with the debug key (fine for testers).
          if [ -n "$XMUX_KEYSTORE_BASE64" ]; then
            echo "$XMUX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            export XMUX_KEYSTORE="$RUNNER_TEMP/upload.jks"
          fi
          vpx _gradle :xmux-quest-app:assembleRelease -PVERSION_NAME=${GITHUB_REF_NAME#v} -PVERSION_CODE=${{ github.run_number }}
          mkdir -p dist
          cp apps/xmux-quest-app/build/outputs/apk/release/xmux-quest-app-release.apk "dist/xmux-quest-${GITHUB_REF_NAME#v}.apk"
          (cd dist && sha256sum "xmux-quest-${GITHUB_REF_NAME#v}.apk" > "xmux-quest-${GITHUB_REF_NAME#v}.apk.sha256")
      - name: Publish the libraries to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: vpx _gradle publishAllPublicationsToGitHubPackagesRepository -PVERSION_NAME=${GITHUB_REF_NAME#v}
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          prerelease: true
  publish:
    runs-on: ubuntu-latest
    needs:
      - bridge
      - android
    permissions:
      contents: write
    steps:
      - name: Publish the completed preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
